<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letterrad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0F12;
    --panel:#171B21;
    --panel-2:#1F252D;
    --edge:#333C46;
    --cue:#FF7A29;
    --cyan:#2ED3E8;
    --text:#E8EDF2;
    --dim:#7C8794;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1B222B 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Barlow",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 18px 48px;
    -webkit-tap-highlight-color:transparent;
  }
  header{text-align:center;margin-bottom:22px}
  .eyebrow{
    font-family:"Barlow Condensed",sans-serif;
    text-transform:uppercase;letter-spacing:.38em;
    font-size:12px;color:var(--dim);margin:0 0 6px;
  }
  h1{
    font-family:"Archivo Black","Barlow Condensed",sans-serif;
    font-size:clamp(30px,9vw,46px);letter-spacing:-.02em;
    margin:0;line-height:.95;
  }
  h1 span{color:var(--cyan)}

  /* ---- deck ---- */
  .deck{
    position:relative;
    width:min(360px,92vw);aspect-ratio:1;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--panel);
    box-shadow:0 26px 60px rgba(0,0,0,.55), inset 0 0 0 1px #2A323B;
    padding:14px;
  }
  .cue{
    position:absolute;top:-4px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:20px solid var(--cue);
    filter:drop-shadow(0 0 10px rgba(255,122,41,.55));
    z-index:5;
  }
  .wheel-wrap{position:relative;width:100%;height:100%;border-radius:50%}
  .wheel{
    position:absolute;inset:0;border-radius:50%;
    box-shadow:inset 0 0 0 2px var(--edge), inset 0 0 40px rgba(0,0,0,.6);
    transition:transform 4s cubic-bezier(.15,.82,.16,1);
    will-change:transform;
  }
  .tick{
    position:absolute;top:50%;left:50%;
    font-family:"Barlow Condensed",sans-serif;
    font-weight:600;font-size:20px;line-height:1;
    transform-origin:center;color:var(--text);
  }
  .tick.used{color:#4A535E}
  .tick.used::after{
    content:"";position:absolute;left:-3px;right:-3px;top:48%;
    height:2px;background:#4A535E;
  }
  /* voortgangsring van de timer, om de hub heen */
  .ring{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:56%;aspect-ratio:1;border-radius:50%;z-index:3;
    background:conic-gradient(var(--cue) 0deg, transparent 0deg);
    opacity:0;transition:opacity .25s;
  }
  .ring.live{opacity:1}
  .ring::after{
    content:"";position:absolute;inset:7px;border-radius:50%;background:var(--panel);
  }
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:44%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #2C343E, #14181D 70%);
    border:1px solid #3A444F;
    color:var(--text);cursor:pointer;
    display:grid;place-items:center;
    z-index:4;
  }
  .hub:hover{border-color:var(--cyan)}
  .hub:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
  .hub:disabled{cursor:not-allowed;opacity:.75}
  .hub .letter{
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(44px,15vw,64px);line-height:1;
  }
  .hub .hint{
    font-family:"Barlow Condensed",sans-serif;
    text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--dim);
  }
  .spinning .hub .letter{color:var(--dim)}
  .speaking .hub{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(46,211,232,.18)}

  /* ---- klok ---- */
  .clock{
    width:min(360px,92vw);margin-top:24px;text-align:center;
  }
  .time{
    font-family:"Archivo Black",sans-serif;
    font-size:clamp(48px,17vw,72px);line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .time.warn{color:var(--cue)}
  .time.out{color:#FF4D4D;animation:pulse .5s ease-in-out 4}
  @keyframes pulse{50%{opacity:.35}}
  .clock-note{
    font-family:"Barlow Condensed",sans-serif;
    text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--dim);
    margin:4px 0 0;min-height:14px;
  }
  .clock-actions{display:flex;gap:8px;justify-content:center;margin-top:12px}

  /* ---- panelen ---- */
  .panel{
    width:min(360px,92vw);margin-top:20px;
    background:var(--panel-2);border:1px solid #2A323B;border-radius:14px;padding:16px;
  }
  .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .row h2{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.2em;font-size:13px;color:var(--dim);margin:0;
  }
  .count{font-family:"Archivo Black",sans-serif;font-size:15px}
  .count b{color:var(--cyan)}

  .presets{display:flex;gap:6px}
  .presets button{
    flex:1;padding:10px 0;border-radius:9px;cursor:pointer;
    background:#141A20;border:1px solid #2E3843;color:var(--dim);
    font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;
  }
  .presets button[aria-pressed="true"]{border-color:var(--cue);color:var(--cue);background:#1D1712}
  .custom{display:flex;align-items:center;gap:10px;margin-top:12px}
  .custom label{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.2em;font-size:11px;color:var(--dim);
  }
  .custom input{
    width:82px;padding:9px 10px;border-radius:9px;
    background:#141A20;border:1px solid #2E3843;color:var(--text);
    font-family:"Barlow",sans-serif;font-size:15px;
  }
  .custom input:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .presets button:disabled,.custom input:disabled{cursor:not-allowed;opacity:.5}
  .presets button:disabled[aria-pressed="true"]{opacity:.85}
  .lock{
    font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.2em;font-size:11px;color:var(--cue);margin:12px 0 0;min-height:14px;
  }

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
  .toggle p{margin:0;font-size:14px;color:var(--dim)}
  .switch{
    position:relative;width:52px;height:28px;flex:none;border-radius:999px;cursor:pointer;
    background:#141A20;border:1px solid #2E3843;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#4A535E;transition:transform .18s, background .18s;
  }
  .switch[aria-pressed="true"]{border-color:var(--cyan)}
  .switch[aria-pressed="true"]::after{transform:translateX(24px);background:var(--cyan)}
  .switch:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .voice-row{margin-top:12px}
  select{
    width:100%;padding:10px;border-radius:9px;
    background:#141A20;border:1px solid #2E3843;color:var(--text);
    font-family:"Barlow",sans-serif;font-size:14px;
  }

  .chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
  .chip{
    width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
    background:#141A20;border:1px solid #2E3843;color:var(--dim);
    font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;
  }
  .chip.fresh{border-color:var(--cue);color:var(--cue)}
  .empty{color:#5C6672;font-size:14px;margin:0}

  .btn{
    padding:12px 16px;background:transparent;border:1px solid #3B4550;border-radius:10px;
    color:var(--text);font-family:"Barlow Condensed",sans-serif;
    text-transform:uppercase;letter-spacing:.2em;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn:hover{border-color:var(--cue);color:var(--cue)}
  .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .btn.wide{width:100%;margin-top:16px}
  .status{margin-top:14px;min-height:20px;text-align:center;font-size:14px;color:var(--cue)}
  @media (prefers-reduced-motion:reduce){
    .wheel{transition-duration:.2s}
    .time.out{animation:none}
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">26 letters, elk één keer</p>
  <h1>Letter<span>rad</span></h1>
</header>

<div class="deck" id="deck">
  <div class="cue" aria-hidden="true"></div>
  <div class="wheel-wrap">
    <div class="wheel" id="wheel" aria-hidden="true"></div>
    <div class="ring" id="ring" aria-hidden="true"></div>
    <button class="hub" id="hub" aria-live="polite">
      <span class="letter" id="letter">–</span>
      <span class="hint" id="hint">Draai</span>
    </button>
  </div>
</div>

<div class="clock">
  <div class="time" id="time">0:30</div>
  <p class="clock-note" id="clockNote">Klaar om te draaien</p>
  <div class="clock-actions">
    <button class="btn" id="pause" disabled>Pauzeer</button>
    <button class="btn" id="stop" disabled>Stop</button>
  </div>
</div>

<section class="panel">
  <div class="row"><h2>Tijd voor deze ronde</h2><span class="count"><b id="secLabel">30</b> sec</span></div>
  <div class="presets" id="presets">
    <button data-sec="10">10s</button>
    <button data-sec="20">20s</button>
    <button data-sec="30" aria-pressed="true">30s</button>
    <button data-sec="60">60s</button>
    <button data-sec="90">90s</button>
  </div>
  <div class="custom">
    <label for="customSec">Eigen tijd</label>
    <input type="number" id="customSec" min="3" max="600" step="1" placeholder="sec">
  </div>
  <p class="lock" id="lockNote" aria-live="polite">Instelbaar tot de eerste draai</p>
</section>

<section class="panel">
  <div class="row"><h2>Spraak</h2></div>
  <div class="toggle">
    <p>Leest de letter hardop voor; de timer start zodra dat klaar is.</p>
    <button class="switch" id="speechToggle" aria-pressed="true" aria-label="Spraak aan of uit"></button>
  </div>
  <div class="voice-row">
    <select id="voice" aria-label="Stem"></select>
  </div>
  <div class="clock-actions" style="margin-top:12px">
    <button class="btn" id="testVoice">Test stem</button>
    <button class="btn" id="testBeep">Test piep</button>
  </div>
  <p class="lock" id="soundNote" aria-live="polite"></p>
</section>

<section class="panel">
  <div class="row">
    <h2>Al geweest</h2>
    <span class="count"><b id="done">0</b> / 26</span>
  </div>
  <div class="chips" id="chips"><p class="empty">Nog geen letters gedraaid.</p></div>
  <button class="btn wide" id="reset">Nieuwe ronde</button>
  <p class="status" id="status"></p>
</section>

<script>
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const SEG = 360 / LETTERS.length;

const $ = id => document.getElementById(id);
const wheel=$("wheel"), hub=$("hub"), deck=$("deck"), ring=$("ring");
const letterEl=$("letter"), hintEl=$("hint");
const chips=$("chips"), doneEl=$("done"), statusEl=$("status");
const timeEl=$("time"), noteEl=$("clockNote");
const pauseBtn=$("pause"), stopBtn=$("stop"), resetBtn=$("reset");
const presets=$("presets"), customSec=$("customSec"), secLabel=$("secLabel"), lockNote=$("lockNote");
const speechToggle=$("speechToggle"), voiceSel=$("voice");
const soundNote=$("soundNote"), testVoice=$("testVoice"), testBeep=$("testBeep");

let used=[], rotation=0, spinning=false;
let duration=30;                 // ingestelde tijd in seconden
let remaining=30, endsAt=0, raf=0, paused=false, running=false;
let speechOn=true, voices=[], audioCtx=null, speechWarmed=false;

/* ---------- wiel ---------- */
function buildWheel(){
  const stops = LETTERS.map((_,i)=>{
    const c = i%2 ? "#1D242C" : "#232C35";
    return `${c} ${i*SEG}deg ${(i+1)*SEG}deg`;
  }).join(",");
  wheel.style.background = `conic-gradient(from ${-SEG/2}deg, ${stops})`;
  wheel.querySelectorAll(".tick").forEach(n=>n.remove());
  const radius = wheel.clientWidth/2 - 26;
  LETTERS.forEach((L,i)=>{
    const s=document.createElement("span");
    s.className="tick"; s.dataset.letter=L; s.textContent=L;
    s.style.transform=`translate(-50%,-50%) rotate(${i*SEG}deg) translateY(${-radius}px)`;
    wheel.appendChild(s);
  });
  paintWheel();
}
function paintWheel(){
  wheel.querySelectorAll(".tick").forEach(t=>{
    t.classList.toggle("used", used.includes(t.dataset.letter));
  });
}
function renderUsed(newest){
  doneEl.textContent = used.length;
  chips.innerHTML = "";
  if(!used.length){ chips.innerHTML='<p class="empty">Nog geen letters gedraaid.</p>'; return; }
  [...used].sort().forEach(L=>{
    const c=document.createElement("span");
    c.className="chip"+(L===newest?" fresh":"");
    c.textContent=L; chips.appendChild(c);
  });
}

/* ---------- klok ---------- */
const fmt = s => `${Math.floor(s/60)}:${String(Math.ceil(s)%60).padStart(2,"0")}`;

function showTime(s){
  timeEl.textContent = fmt(Math.max(0,s));
  timeEl.classList.toggle("warn", running && s<=5 && s>0);
}
function setRing(frac){
  ring.style.background = `conic-gradient(var(--cue) ${frac*360}deg, transparent ${frac*360}deg)`;
}
let locked=false;   // tijd staat vast zodra de ronde begonnen is

function setLocked(state){
  locked = state;
  [...presets.children].forEach(b=>{ b.disabled = state; });
  customSec.disabled = state;
  lockNote.textContent = state
    ? `Vastgezet op ${duration} sec — reset voor een andere tijd`
    : "Instelbaar tot de eerste draai";
}
function setDuration(sec){
  if(locked) return;
  duration = Math.min(600, Math.max(3, Math.round(sec)));
  secLabel.textContent = duration;
  [...presets.children].forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.sec===duration)));
  if(!running){ remaining=duration; showTime(duration); }
}
function startTimer(){
  running=true; paused=false;
  remaining=duration; endsAt=performance.now()+duration*1000;
  ring.classList.add("live");
  timeEl.classList.remove("out");
  pauseBtn.disabled=false; stopBtn.disabled=false;
  pauseBtn.textContent="Pauzeer";
  noteEl.textContent="Tijd loopt";
  tick();
}
function tick(){
  remaining = (endsAt - performance.now())/1000;
  showTime(remaining);
  setRing(1 - Math.min(1, Math.max(0, remaining/duration)));
  if(remaining<=0){ timeUp(); return; }
  raf = requestAnimationFrame(tick);
}
function timeUp(){
  cancelAnimationFrame(raf);
  running=false; remaining=0;
  timeEl.textContent="0:00";
  timeEl.classList.remove("warn"); timeEl.classList.add("out");
  noteEl.textContent="Tijd om";
  setRing(1);
  pauseBtn.disabled=true; stopBtn.disabled=true;
  beep();
  hub.disabled = used.length===26;
  hintEl.textContent = used.length===26 ? "Ronde vol" : "Draai";
}
function togglePause(){
  if(!running && !paused) return;
  if(paused){
    paused=false; endsAt=performance.now()+remaining*1000; running=true;
    pauseBtn.textContent="Pauzeer"; noteEl.textContent="Tijd loopt"; tick();
  }else{
    paused=true; running=false; cancelAnimationFrame(raf);
    pauseBtn.textContent="Hervat"; noteEl.textContent="Gepauzeerd";
  }
}
function stopTimer(quiet){
  cancelAnimationFrame(raf);
  running=false; paused=false;
  ring.classList.remove("live"); setRing(0);
  timeEl.classList.remove("warn","out");
  remaining=duration; showTime(duration);
  pauseBtn.disabled=true; stopBtn.disabled=true; pauseBtn.textContent="Pauzeer";
  if(!quiet) noteEl.textContent="Gestopt";
  hub.disabled = used.length===26;
}
function unlockAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){}
  // iOS/Safari: spraakmotor wakker maken binnen een klik
  if(!speechWarmed && "speechSynthesis" in window){
    try{
      const u=new SpeechSynthesisUtterance(" ");
      u.volume=0; speechSynthesis.speak(u); speechWarmed=true;
    }catch(e){}
  }
}
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime + .02;
    [0,.22,.44].forEach(t=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="triangle"; o.frequency.value=880;
      g.gain.setValueAtTime(.0001, t0+t);
      g.gain.exponentialRampToValueAtTime(.3, t0+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t0+t+.16);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0+t); o.stop(t0+t+.2);
    });
  }catch(e){
    soundNote.textContent="Deze browser blokkeert geluid in dit venster.";
  }
}

/* ---------- spraak ---------- */
function loadVoices(){
  if(!("speechSynthesis" in window)){
    voiceSel.innerHTML='<option>Geen spraak in deze browser</option>';
    voiceSel.disabled=true; speechOn=false;
    speechToggle.setAttribute("aria-pressed","false"); speechToggle.disabled=true;
    return;
  }
  voices = speechSynthesis.getVoices();
  const nl = voices.filter(v=>v.lang.toLowerCase().startsWith("nl"));
  const list = nl.length ? nl.concat(voices.filter(v=>!nl.includes(v))) : voices;
  voiceSel.innerHTML="";
  list.forEach(v=>{
    const o=document.createElement("option");
    o.value=v.name; o.textContent=`${v.name} (${v.lang})`;
    voiceSel.appendChild(o);
  });
  if(!list.length) voiceSel.innerHTML='<option>Standaardstem</option>';
}
function speakLetter(L, done){
  if(!speechOn || !("speechSynthesis" in window)){ done(); return; }
  let fired=false;
  const go=()=>{ if(!fired){ fired=true; clearTimeout(guard); done(); } };
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(L);
    const v=voices.find(x=>x.name===voiceSel.value);
    if(v) u.voice=v;
    u.lang = v ? v.lang : "nl-NL";
    u.rate=.85; u.pitch=1;
    u.onend=go; u.onerror=go;
    deck.classList.add("speaking");
    noteEl.textContent="Letter wordt voorgelezen…";
    speechSynthesis.speak(u);
    var guard = setTimeout(go, 4000);   // vangnet als onend niet komt
  }catch(e){ go(); }
  const cleanup=setInterval(()=>{
    if(fired){ deck.classList.remove("speaking"); clearInterval(cleanup); }
  },80);
}

/* ---------- draaien ---------- */
function spin(){
  if(spinning) return;
  const left = LETTERS.filter(L=>!used.includes(L));
  if(!left.length){ statusEl.textContent="Alle 26 letters zijn geweest. Start een nieuwe ronde."; return; }

  stopTimer(true);
  if(!locked) setLocked(true);
  spinning=true; deck.classList.add("spinning"); hub.disabled=true;
  statusEl.textContent=""; letterEl.textContent="–"; hintEl.textContent="…";
  noteEl.textContent="Rad draait";

  const pick = left[Math.floor(Math.random()*left.length)];
  const index = LETTERS.indexOf(pick);
  const target = -index*SEG;
  const delta = ((target - rotation)%360 + 360)%360;
  rotation += delta + 360*(4+Math.floor(Math.random()*3));
  wheel.style.transform=`rotate(${rotation}deg)`;

  const ms = matchMedia("(prefers-reduced-motion:reduce)").matches ? 220 : 4000;
  setTimeout(()=>{
    used.push(pick);
    letterEl.textContent=pick;
    hintEl.textContent = used.length===26 ? "Ronde vol" : "Draai";
    paintWheel(); renderUsed(pick);
    spinning=false; deck.classList.remove("spinning");
    if(used.length===26) statusEl.textContent="Alle 26 letters zijn geweest.";
    speakLetter(pick, startTimer);   // timer start ná het voorlezen
  }, ms);
}

function resetGame(){
  if(spinning) return;
  if("speechSynthesis" in window) speechSynthesis.cancel();
  deck.classList.remove("speaking");
  used=[]; setLocked(false); stopTimer(true);
  letterEl.textContent="–"; hintEl.textContent="Draai";
  noteEl.textContent="Klaar om te draaien";
  hub.disabled=false;
  paintWheel(); renderUsed();
  statusEl.textContent="Nieuwe ronde — alle 26 letters staan weer klaar.";
  setTimeout(()=>{ statusEl.textContent=""; },2600);
}

/* ---------- events ---------- */
hub.addEventListener("click", spin);
resetBtn.addEventListener("click", resetGame);
pauseBtn.addEventListener("click", togglePause);
stopBtn.addEventListener("click", ()=>stopTimer(false));
presets.addEventListener("click", e=>{
  const b=e.target.closest("button[data-sec]");
  if(!b) return; customSec.value=""; setDuration(+b.dataset.sec);
});
customSec.addEventListener("input", ()=>{
  const v=parseInt(customSec.value,10);
  if(!isNaN(v) && v>=3) setDuration(v);
});
speechToggle.addEventListener("click", ()=>{
  speechOn=!speechOn;
  speechToggle.setAttribute("aria-pressed", String(speechOn));
  if(!speechOn && "speechSynthesis" in window) speechSynthesis.cancel();
});
addEventListener("pointerdown", unlockAudio, {once:false});
testVoice.addEventListener("click", ()=>{
  unlockAudio();
  if(!("speechSynthesis" in window)){ soundNote.textContent="Deze browser heeft geen spraakmotor."; return; }
  soundNote.textContent="Bezig met voorlezen…";
  const prev = speechOn; speechOn = true;
  speakLetter("A", ()=>{ soundNote.textContent="Stem klaar."; speechOn = prev; });
});
testBeep.addEventListener("click", ()=>{ unlockAudio(); beep(); soundNote.textContent="Piep afgespeeld."; });
addEventListener("resize", buildWheel);
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = loadVoices;
